# GHMC Civic Portal Configuration

spring.application.name=ghmc-portal
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ghmc_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Initial SQL Script Execution (Defer data seeding until Hibernate creates tables)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/data-postgres.sql
spring.jpa.defer-datasource-initialization=true

# JWT Security Configuration
ghmc.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
ghmc.jwt.expiration-ms=86400000

# Redis & Spring Session Configuration
spring.session.store-type=redis
spring.session.redis.namespace=SPRING_SESSION
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=5000

# Google Gemini 1.5 Flash API Configuration
ghmc.ai.gemini.api-key=${GEMINI_API_KEY:demo_key}
ghmc.ai.gemini.model=gemini-1.5-flash
ghmc.ai.gemini.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
